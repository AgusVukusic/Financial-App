name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Cancela ejecuciones viejas de la misma rama cuando llega un push nuevo
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint, unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22.x (igual que Vercel)
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Unit tests
      run: npm test

    - name: Build
      run: npm run build

  emulators:
    name: Firestore rules and Cloud Functions (emulators)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: npm
        cache-dependency-path: |
          package-lock.json
          functions/package-lock.json

    # Los emuladores de Firestore/Functions corren sobre Java
    - name: Use Java 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'

    - name: Install dependencies (app)
      run: npm ci

    - name: Install dependencies (functions)
      run: npm ci
      working-directory: functions

    # Evita volver a bajar los .jar de los emuladores en cada ejecución.
    # La versión de firebase-tools está fijada en los scripts de package.json.
    - name: Cache Firebase emulators
      uses: actions/cache@v4
      with:
        path: ~/.cache/firebase/emulators
        key: firebase-emulators-${{ runner.os }}-15.35.0

    - name: Firestore rules tests
      run: npm run test:rules

    - name: Cloud Functions tests
      run: npm run test:functions
